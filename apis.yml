aid: spindl
name: Spindl
description: >-
  Spindl is a Web3 growth platform providing onchain attribution, web3-native
  analytics, audiences, short links, referrals, and ads in one place, helping
  developers understand where their users come from and how they behave across
  onchain apps. It offers a JavaScript/HTML SDK, Android and iOS SDKs, and a
  Server-to-Server REST API for campaign and attribution management, short
  (redirect) links, server-side custom event ingestion, and daily data exports.
  Positioned as Web3's answer to Mixpanel and Amplitude, Spindl is used by teams
  including Uniswap, Base, Safe, and Morpho. A separate publisher-facing Ads
  API on e.spindlembed.com serves targeted onchain ad recommendations and
  records impressions and clicks, with a React BannerEmbed component and a
  hosted iframe as no-code alternatives. Spindl announced in January 2025 that
  it was joining Coinbase and now operates as a product team inside Base.
  Originally added to the API Evangelist network as a portfolio-lead stub, now
  enriched from its published developer documentation and live host probes.
